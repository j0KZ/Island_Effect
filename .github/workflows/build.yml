name: build

# Lo que comprueba un runner sin Mac delante: que compile sin warnings, que los
# tests de la lógica pasen y que el bundle quede armado y firmado. Cómo se ve la
# isla en pantalla sigue siendo cosa de mirarla.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Entorno
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Compilar (debug, con warnings a la vista)
        run: swift build -v 2>&1 | tail -80

      - name: Sin warnings
        # Los warnings se arreglaron en el PR #2; que no vuelvan a colarse.
        run: |
          swift build 2>&1 | tee /tmp/build.log
          ! grep -q "warning:" /tmp/build.log

      - name: Tests
        run: swift test

      - name: Compilar y empaquetar (release)
        run: ./build.sh

      - name: Comprobar el bundle
        run: |
          APP="build/Island Effect.app"
          test -x "$APP/Contents/MacOS/IslandEffect"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          test -f "$APP/Contents/Resources/en.lproj/Localizable.strings"
          test -f "$APP/Contents/Resources/es.lproj/Localizable.strings"
          codesign --verify --verbose "$APP"
          plutil -lint "$APP/Contents/Info.plist"
